title: Suspicious LSASS Access
slug: win_susp_lsass_access
status: experimental
description: >
  Detects processes opening LSASS with access rights commonly used for credential dumping.
  Backup and EDR agents may also open LSASS with limited rights.
references:
  - https://github.com/SigmaHQ/sigma
  - https://attack.mitre.org/techniques/T1003/001/
tags:
  - attack.credential_access
  - attack.t1003.001
level: high
falsepositives:
  - Antivirus and EDR sensors reading LSASS for protection
detection:
  selection:
    TargetImage|endswith: '\lsass.exe'
  condition: selection
